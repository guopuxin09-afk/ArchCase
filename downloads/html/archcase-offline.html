/* ============================================================
   NIGHT THEME — warm espresso glass.
   Day colours are untouched: everything here is scoped to
   html[data-theme="dark"]. Surfaces step page < pane < raised card;
   depth comes from soft warm rims and black shadows, and the hues
   lean warm so the orange accent sits in the same family as the
   greys instead of against a cool violet.
   ============================================================ */
html[data-theme="dark"]{
  color-scheme:dark;
  background:#14120f;
  --paper:#14120f;--white:#1f1b17;--ink:#ece4d6;--muted:#a3988a;--line:rgba(255,226,192,.1);
  --accent:#e2884c;--accent-hover:#eea067;--soft:#25201b;--accent-soft:rgba(226,136,76,.16);

  /* Liquid sheen at night: a faint warm bloom at the upper-left plus a short
     top falloff, so the glass reads as reflection rather than as a light. */

  --glass-rim:inset 0 1px 0 rgba(255,240,222,.12),inset 0 0 0 1px rgba(255,236,214,.025),inset 0 -1px 0 rgba(0,0,0,.28);
  --shadow:0 14px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.34);
  --cat-0:#e0915d;--cat-1:#97abbf;--cat-2:#c8a46e;--cat-3:#d4927f;--cat-4:#8fb2ba;--cat-5:#b99db2;
  --cat-6:#cbb07a;--cat-7:#dd9f66;--cat-8:#a3a6c8;--cat-9:#bba78f;--cat-10:#d79d86;--cat-11:#bcab79
}

/* Night basemap: invert + 180° hue keeps land, water and labels in their own

/* Theme toggle: a glass pill matching the language switch; both sit in the
   masthead as one control cluster so the header keeps a single reading line. */
.theme-toggle{display:inline-flex;align-items:center;gap:3px;padding:3px;border:1px solid #decebc;border-radius:999px;background:#fffaf266}
.theme-toggle button{position:relative;display:grid;place-items:center;width:26px;height:22px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--muted)}
.theme-toggle button svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle button[aria-pressed="true"]{background:var(--accent);color:#fffdf8}
.theme-toggle button:not([aria-pressed="true"]):hover{color:var(--accent)}

/* Segmented thumbs: once script has measured the buttons, the pressed fill
   becomes a single pill that glides between options instead of blinking.
   It is the same accent fill, so the resting look does not change. */
.language-switch,.theme-toggle{position:relative;isolation:isolate}
.language-switch.has-thumb:before,.theme-toggle.has-thumb:before{content:"";position:absolute;z-index:-1;left:0;top:3px;bottom:3px;width:var(--thumb-w,0px);border-radius:999px;background:var(--accent);transform:translateX(var(--thumb-x,0px));transition:transform .5s var(--sheet-ease),width .5s var(--sheet-ease),background-color .3s}

/* Theme and language changes run as view transitions: the new theme opens as
   a circle from the toggle; a language change cross-fades the page while the
   title slides. Root snapshots are composited images, so neither transition
   re-renders the map or the list per frame. */
/* The page stays clickable while a transition plays. */
::view-transition{pointer-events:none}
html.vt-theme::view-transition-old(root),html.vt-theme::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.vt-theme::view-transition-new(root){z-index:2}

html.vt-lang::view-transition-new(root){animation:vt-fade-in .34s cubic-bezier(.4,0,.2,1) both}

html.vt-lang::view-transition-group(atlas-title){animation-duration:.46s;animation-timing-function:var(--ease)}
html.vt-lang::view-transition-old(atlas-title),html.vt-lang::view-transition-new(atlas-title){width:auto;height:100%}

html.vt-lang::view-transition-new(atlas-title){animation:vt-title-in .46s var(--ease) .08s both}
@keyframes vt-fade-out{to{opacity:0}}
@keyframes vt-fade-in{from{opacity:0}}

/* Paint containment: the list and the map are independently scrolling
   subtrees, so keep their repaints local. Rows outside the list's viewport

      // Thumb geometry follows the buttons' rendered size (fonts, breakpoints).
      const resyncThumbs = () => { syncThumb($('language-switch'), false); syncThumb($('theme-toggle'), false); };
      document.fonts?.ready.then(resyncThumbs);
      if (window.ResizeObserver) new ResizeObserver(resyncThumbs).observe($('language-switch'));
      startMap();
    })();
  </script>
