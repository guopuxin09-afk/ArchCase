      async function startMap() {
        if (loading || map) return; loading = true; $('network-status').hidden = false; $('retry-map').hidden = true; setStatus('network-message', '地图载入中…');

          await Promise.all([dependency('leaflet@1.9.4/dist/leaflet.css', 'style'), dependency('leaflet.markercluster@1.5.3/dist/MarkerCluster.css', 'style')]);
          if (!window.L) await dependency('leaflet@1.9.4/dist/leaflet.js', 'script');

          const L = window.L;
          map = L.map('map', {worldCopyJump: true, minZoom: narrowMedia.matches ? 0 : 1, zoomSnap: narrowMedia.matches ? .25 : 1, maxZoom: 19, maxBounds: [[-85.05112878, -540], [85.05112878, 540]], maxBoundsViscosity: 1, zoomAnimation: !reduceMotion, fadeAnimation: !reduceMotion, markerZoomAnimation: !reduceMotion, zoomControl: false, scrollWheelZoom: true, wheelDebounceTime: 60, wheelPxPerZoomLevel: 100}).setView([30, 25], 2);
          const ButtonZoom = L.Control.extend({
            options: {position: 'bottomright'},
            onAdd(leafletMap) {
              const box = L.DomUtil.create('div', 'leaflet-bar leaflet-control-zoom');
              const plus = node('button', '', '+'), minus = node('button', '', '−');
              plus.type = minus.type = 'button'; plus.setAttribute('aria-label', t('放大地图')); minus.setAttribute('aria-label', t('缩小地图'));
              plus.title = t('放大地图'); minus.title = t('缩小地图'); box.append(plus, minus);
              L.DomEvent.disableClickPropagation(box); L.DomEvent.disableScrollPropagation(box);
              plus.addEventListener('click', event => { L.DomEvent.stop(event); leafletMap.zoomIn(); });
              minus.addEventListener('click', event => { L.DomEvent.stop(event); leafletMap.zoomOut(); });
              this.updateButtons = () => { plus.disabled = leafletMap.getZoom() >= leafletMap.getMaxZoom(); minus.disabled = leafletMap.getZoom() <= leafletMap.getMinZoom(); };
              leafletMap.on('zoomend zoomlevelschange', this.updateButtons); this.updateButtons(); return box;
            },
            onRemove(leafletMap) { leafletMap.off('zoomend zoomlevelschange', this.updateButtons); }
          });
          new ButtonZoom().addTo(map);
          map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener noreferrer">Leaflet</a>');
          const attribution = map.attributionControl.getContainer();
          const syncAttributionHeight = () => {
            $('map').parentElement.style.setProperty('--attribution-height', Math.ceil(attribution.getBoundingClientRect().height) + 'px');
          };
          if (window.ResizeObserver) new ResizeObserver(syncAttributionHeight).observe(attribution);
          attribution.addEventListener('mouseenter', syncAttributionHeight);
          attribution.addEventListener('mouseleave', syncAttributionHeight);
          attribution.addEventListener('focusin', syncAttributionHeight);
          attribution.addEventListener('focusout', syncAttributionHeight);
          syncAttributionHeight();

          // render time and are refreshed when the user switches.
          paintMapTheme();
          // Narrow screens get smaller discs and a wider merge radius, so the

          const clusterSize = count => narrowMedia.matches ? (count > 50 ? 40 : count > 10 ? 34 : 30) : (count > 50 ? 48 : count > 10 ? 42 : 36);
          cluster = L.markerClusterGroup({animate: !reduceMotion, maxClusterRadius: narrowMedia.matches ? 52 : 43, spiderfyOnMaxZoom: false, zoomToBoundsOnClick: false, showCoverageOnHover: false, spiderfyDistanceMultiplier: 1.7, removeOutsideVisibleBounds: true, spiderLegPolylineOptions: {weight: 1.5, color: mapColors[theme].leg, opacity: mapColors[theme].legOpacity}, iconCreateFunction: group => { const count = group.getChildCount(); const size = clusterSize(count); return L.divIcon({html: '<span class="cluster-pin">' + count + '</span>', className: 'atlas-cluster', iconSize: [size, size], iconAnchor: [size / 2, size / 2]}); }});
          for (const c of cases.filter(canLocate)) {
            const pin = node('span', 'case-pin'); pin.style.setProperty('--pin-color', categoryColors.get(c.category));
            const marker = L.marker([Number(c.latitude), Number(c.longitude)], {alt: cleanTitle(c), riseOnHover: true, icon: L.divIcon({html: pin, className: 'atlas-marker', iconSize: [28, 28], iconAnchor: [14, 14]})});
            marker.archcase = c;
            marker.on('add', () => marker.getElement()?.setAttribute('aria-label', t('查看：') + cleanTitle(c)));
            marker.on('mouseover', () => schedulePreview(marker, c)); marker.on('mouseout', delayClosePreview);
            marker.on('click', () => {
              pinPreview(marker, c); selectedKey = c.key;
              for (const row of $('case-list').children) row.classList.toggle('active', row.dataset.key === selectedKey);
            });
            markers.set(c.key, marker);
          }
          cluster.on('clustermouseover', event => schedulePreview(event.layer)); cluster.on('clustermouseout', delayClosePreview); cluster.on('clusterclick clusterkeypress', event => { if (event.type === 'clusterkeypress' && event.originalEvent?.keyCode !== 13) return; expandCluster(event.layer); if (event.originalEvent?.keyCode === 13) map.getContainer().focus(); });

          map._limitCenter = function (center, zoom, bounds) {

            if (!bounds || !inset) return limitCenter.call(this, center, zoom, bounds);
            const size = this.getSize(), centerPoint = this.project(center, zoom), corner = centerPoint.subtract([size.x / 2, size.y / 2]);
            const offset = this._getBoundsOffset(L.bounds(corner, corner.add([size.x, size.y - inset])), bounds, zoom);
            return Math.abs(offset.x) <= 1 && Math.abs(offset.y) <= 1 ? center : this.unproject(centerPoint.add(offset), zoom);
          };
          for (const type of ['pointerdown', 'wheel', 'keydown']) map.getContainer().addEventListener(type, () => { mapTouched = true; }, {passive: true});
          sheetControls = map.getContainer().querySelector('.leaflet-bottom.leaflet-right');
          if (sidebarMedia.matches && sheet.max) placeSheetControls(sheet.visible, false);
          map.addLayer(cluster); filter(); syncMapViewport(); fitVisible(); $('network-status').hidden = true;
          loadBase();

        } catch (_) {
          if (map) { map.remove(); map = null; cluster = null; worldLayer = null; streetLayer = null; markers.clear(); }
          setStatus('network-message', '地图资源暂时无法加载。搜索与分类仍可使用，点击 ↗ 打开原案例。'); $('retry-map').hidden = false; $('fit-map').disabled = true;
        } finally { loading = false; }
      }
      $('retry-map').addEventListener('click', startMap);
      $('retry-base').addEventListener('click', loadBase);
      window.addEventListener('online', loadBase);
      window.addEventListener('offline', loadBase);
      narrowMedia.addEventListener('change', () => {
        if (!map) return;
        map.options.zoomSnap = narrowMedia.matches ? .25 : 1;
        map.setMinZoom(narrowMedia.matches ? 0 : 1);
        cluster?.refreshClusters();
      });

      function changeLanguage(nextLanguage) {
        if (!['zh','en'].includes(nextLanguage)) return;
        const layer = previewLayer, wasPinned = preview.classList.contains('is-pinned');
        const scrollTop = $('case-list').scrollTop;
        language = nextLanguage;
        try { localStorage.setItem('archcase-language', language); } catch (_) {}
        applyLanguage(); updateDate();
        setCategoriesCollapsed($('filters').classList.contains('categories-collapsed'), false);
        for (const label of $('categories').children) {
          label.title = categoryLabel(label.querySelector('input').value);
          label.querySelector('.category-name').textContent = label.title;
        }
        // Row text, sort order and the alt labels all depend on the language;
        // filter() reuses the existing nodes, and the scroll position is
        // restored right after so switching does not move the reader.
        buildSearchIndex();
        filter({ resetScroll: false });
        $('case-list').scrollTop = scrollTop;
        for (const marker of markers.values()) {
          marker.options.alt = cleanTitle(marker.archcase);
          const el = marker.getElement();
          if (el) { el.setAttribute('alt', cleanTitle(marker.archcase)); el.setAttribute('aria-label', t('查看：') + cleanTitle(marker.archcase)); }
        }
        const zoomButtons = document.querySelectorAll('.leaflet-control-zoom button');
        zoomButtons.forEach((button, index) => { const label = t(index ? '缩小地图' : '放大地图'); button.title = label; button.setAttribute('aria-label', label); });
        if (!$('fallback-detail').hidden && selectedKey) {
          const selected = cases.find(c => c.key === selectedKey);
          if (selected) $('fallback-content').replaceChildren(detail(selected));
        }
        if (layer && map?.hasLayer(layer)) showPreview(layer, layer.archcase, wasPinned);
        updateCategoryFade(); queueViewportSync();
      }
      // Language changes cross-fade the whole page as one composited snapshot
      // (the title also slides), so re-sorted rows and rewritten labels arrive
      // together instead of popping in place.
      function switchLanguage(nextLanguage) {
        if (nextLanguage === language || !['zh', 'en'].includes(nextLanguage)) return;
        if (!canViewTransition()) {
          changeLanguage(nextLanguage);
          if (!reduceMotion) for (const target of document.querySelectorAll('.masthead, .filters, .result-bar, .case-list, .map-top')) target.animate?.([{opacity: .35}, {opacity: 1}], {duration: 300, easing: 'ease-out'});
          return;
        }
        const root = document.documentElement;
        root.classList.add('vt-lang');
        try { document.startViewTransition(() => changeLanguage(nextLanguage)).finished.finally(() => root.classList.remove('vt-lang')); }
        catch (_) { root.classList.remove('vt-lang'); changeLanguage(nextLanguage); }
      }
      document.querySelectorAll('[data-language]').forEach(button => button.addEventListener('click', () => switchLanguage(button.dataset.language)));
      // The stored preference lives under one key so the head script and this
      // handler cannot disagree. The switch is a class flip on <html>, so the
      // repaint is a single style recalculation rather than a re-render.

      if (themeGroup) themeGroup.querySelectorAll('[data-theme-value]').forEach(button => button.addEventListener('click', event => {
        event.preventDefault();
        switchTheme(button.dataset.themeValue, button);
        if (themeGroup.contains(document.activeElement)) applyThemeLabels();
      }));
      if (window.matchMedia) {
        const schemeMedia = window.matchMedia('(prefers-color-scheme: dark)');
        const followSystem = event => {
          let stored = null;
          try { stored = localStorage.getItem('archcase-theme'); } catch (_) {}
          if (stored) return;
          switchTheme(event.matches ? 'dark' : 'light', null, false);
        };
        schemeMedia.addEventListener ? schemeMedia.addEventListener('change', followSystem) : schemeMedia.addListener?.(followSystem);
      }
      applyTheme(theme, false);
      // While the list is actively scrolling, drop the row transition and
      // hover/shadow work so a fling stays on the compositor.
      let scrollIdleTimer = 0;
      $('case-list').addEventListener('scroll', () => {
        const list = $('case-list');
        if (!list.classList.contains('is-scrolling')) list.classList.add('is-scrolling');
        clearTimeout(scrollIdleTimer);
        scrollIdleTimer = setTimeout(() => list.classList.remove('is-scrolling'), 160);
      }, {passive: true});
      changeLanguage(language);
      // Thumb geometry follows the buttons' rendered size (fonts, breakpoints).
      const resyncThumbs = () => { syncThumb($('language-switch'), false); syncThumb($('theme-toggle'), false); };
      document.fonts?.ready.then(resyncThumbs);
      if (window.ResizeObserver) new ResizeObserver(resyncThumbs).observe($('language-switch'));
      startMap();
    })();
