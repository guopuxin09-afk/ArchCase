name: Import audited ArchCase package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'guopuxin09-afk/ArchCase' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and import the prepared public files
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, stat, subprocess, zipfile
          root = pathlib.Path.cwd().resolve()
          archive = root / 'archcase-public-package.zip'
          expected = '35a31515017816859b05734b4816a06a262ad4642bc209da168052d895e7530c'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Archive checksum mismatch'
          with zipfile.ZipFile(archive) as package:
              entries = package.infolist()
              assert len(entries) == 595 and sum(e.file_size for e in entries) < 20000000
              names = [e.filename for e in entries]
              assert len(set(names)) == len(names)
              for entry in entries:
                  p = pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts and chr(92) not in entry.filename
                  assert not {'.git', '.github', 'node_modules', '.tools', '.gradle', '.openai', '.obsidian'}.intersection(p.parts)
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
                  target = root.joinpath(*p.parts)
                  assert target.resolve().is_relative_to(root)
                  assert not target.is_symlink() and not any(parent.is_symlink() for parent in target.parents)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(package.read(entry))
          archive.unlink()
          subprocess.run(['node', 'scripts/check-publication.cjs'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--force', '--', *names, archive.name], check=True)
          subprocess.run(['git', 'update-index', '--chmod=+x', 'android/android/gradlew'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Publish ArchCase notes, maps, Android app and bilingual guides'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          PY
